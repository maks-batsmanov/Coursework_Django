{% extends 'base.html' %}
{% block title %}Получатели{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Получатели</h2>
    <a href="{% url 'mailing:recipient_create' %}" class="btn btn-primary"> Добавить</a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>Email</th>
                    <th>ФИО</th>
                    <th class="text-end">Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for recipient in recipients %}
                <tr>
                    <td>{{ recipient.email }}</td>
                    <td>{{ recipient.full_name }}</td>
                    <td class="text-end">
                        <a href="{% url 'mailing:recipient_update' recipient.pk %}" class="btn btn-sm btn-outline-primary"></a>
                        <a href="{% url 'mailing:recipient_delete' recipient.pk %}" class="btn btn-sm btn-outline-danger"></a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">Получателей пока нет</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
