{% extends 'base.html' %}
{% block title %}Удаление получателя{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Удаление получателя</h4>
            </div>
            <div class="card-body">
                <p class="mb-3">Вы уверены, что хотите удалить получателя?</p>
                <dl class="row mb-0">
                    <dt class="col-sm-4">Email</dt>
                    <dd class="col-sm-8">{{ recipient.email }}</dd>

                    <dt class="col-sm-4">ФИО</dt>
                    <dd class="col-sm-8">{{ recipient.full_name }}</dd>
                </dl>
            </div>
            <div class="card-footer d-flex justify-content-between bg-white">
                <a href="{% url 'mailing:recipient_list' %}" class="btn btn-outline-secondary">Отмена</a>
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
