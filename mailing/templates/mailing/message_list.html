{% extends 'base.html' %}
{% block title %}Письма{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Письма</h2>
    <a href="{% url 'mailing:message_create' %}" class="btn btn-primary"> Добавить</a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>Тема</th>
                    <th>Текст</th>
                    <th class="text-end">Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for message in messages %}
                <tr>
                    <td>{{ message.subject }}</td>
                    <td>{{ message.body }}</td>
                    <td class="text-end">
                        <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-sm btn-outline-primary">Добавить</a>
                        <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">Писем пока нет</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
