{% extends 'base.html' %}
{% block title %}Получатель: {{ recipient.email }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Получатель</h4>
            </div>
            <div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-sm-4">Email</dt>
                    <dd class="col-sm-8">{{ recipient.email }}</dd>

                    <dt class="col-sm-4">ФИО</dt>
                    <dd class="col-sm-8">{{ recipient.full_name }}</dd>

                    <dt class="col-sm-4">Комментарий</dt>
                    <dd class="col-sm-8">{{ recipient.comment|default:"—" }}</dd>
                </dl>
            </div>
            <div class="card-footer d-flex justify-content-between bg-white">
                <a href="{% url 'mailing:recipients_list' %}" class="btn btn-outline-secondary">Назад</a>
                <div>
                    <a href="{% url 'mailing:recipient_update' recipient.pk %}" class="btn btn-primary">Редактировать</a>
                    <a href="{% url 'mailing:recipient_delete' recipient.pk %}" class="btn btn-outline-danger">Удалить</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
