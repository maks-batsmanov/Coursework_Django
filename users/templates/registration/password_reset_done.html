{% extends 'base.html' %}
{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Письмо отправлено</h4>
            </div>
            <div class="card-body">
                <p>Мы отправили инструкцию по восстановлению пароля на указанный email. Проверьте почту (и папку «Спам»).</p>
                <a href="{% url 'users:login' %}" class="btn btn-outline-secondary">← Вернуться к входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
