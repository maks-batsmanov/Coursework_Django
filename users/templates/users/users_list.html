{% extends 'base.html' %}
{% block title %}Пользователи{% endblock %}

{% block content %}
<h2>Пользователи</h2>
<table class="table table-hover">
    <thead>
        <tr><th>Email</th><th>Статус</th><th>Действия</th></tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.email }}</td>
            <td>
                {% if u.is_blocked %}<span class="badge bg-danger">Заблокирован</span>
                {% else %}<span class="badge bg-success">Активен</span>{% endif %}
            </td>
            <td>
                <form method="post" action="{% url 'users:toggle_block' u.pk %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-warning">
                        {% if u.is_blocked %}Разблокировать{% else %}Заблокировать{% endif %}
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
