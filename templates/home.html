{% extends 'base.html' %}
{% block title %}Главная{% endblock %}

{% block content %}
<h2 class="mb-4">Статистика сервиса рассылок</h2>

<div class="row g-4">
    <div class="col-md-4">
        <div class="card shadow-sm text-center h-100">
            <div class="card-body">
                <h1 class="display-4 text-primary">{{ total_mailings }}</h1>
                <p class="text-muted mb-0">Всего рассылок</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm text-center h-100">
            <div class="card-body">
                <h1 class="display-4 text-success">{{ active_mailings }}</h1>
                <p class="text-muted mb-0">Активных рассылок</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm text-center h-100">
            <div class="card-body">
                <h1 class="display-4 text-info">{{ total_recipients }}</h1>
                <p class="text-muted mb-0">Уникальных получателей</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
